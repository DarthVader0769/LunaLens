[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunalens"
version = "0.1.0"
description = "Interpretable lunar-image observation planning and reproducible simulation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2.4",
  "scipy>=1.11,<1.17",
  "scikit-image>=0.23,<0.27",
  "matplotlib>=3.8,<4",
  "plotly>=5.20,<7",
  "streamlit>=1.66,<2",
  "pandas>=2.1,<3",
  "Pillow>=10.4,<13",
  "tifffile>=2024.7,<=2025.5.10",
  "networkx>=3.0,<3.7",
  "contourpy>=1.0.1,<1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

